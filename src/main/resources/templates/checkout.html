<!doctype html>
<html lang="sr-Latn" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Kupovina ulaznica')}"></head>
  <body>
    <header th:replace="~{fragments :: header}"></header>
    <main class="container page-space narrow">
      <a class="back-link" th:href="@{/events/{id}(id=${type.event.id})}"
        >← Nazad na događaj</a
      ><span class="eyebrow">JOŠ SAMO JEDAN KORAK</span>
      <h1>Tvoje mesto te čeka<span class="brand-dot">.</span></h1>
      <div th:replace="~{fragments :: alerts}"></div>
      <section class="panel checkout-panel">
        <span class="badge" th:text="${type.event.category.name}"></span>
        <h2 th:text="${type.event.title}"></h2>
        <p
          th:text="${#temporals.format(type.event.startsAt,'dd.MM.yyyy. · HH:mm')} + ' · ' + ${type.event.venue.name}"
        ></p>
        <hr />
        <form
          th:action="@{/checkout/{id}(id=${type.id})}"
          method="post"
          class="stack-form"
          th:if="${onSale and remaining > 0}"
        >
          <div class="checkout-line">
            <div>
              <strong th:text="${type.name}"></strong>
              <p
                th:text="${#numbers.formatDecimal(type.price,1,'POINT',2,'COMMA')} + ' RSD po ulaznici'"
              ></p>
            </div>
            <label
              >Broj ulaznica<input
                id="quantity"
                type="number"
                name="quantity"
                value="1"
                min="1"
                th:max="${T(java.lang.Math).min(10L,remaining)}"
                th:attr="data-price=${type.price}"
                required
            /></label>
          </div>
          <div class="checkout-total">
            <span>Ukupno za plaćanje</span
            ><strong
              id="checkout-total"
              th:text="${#numbers.formatDecimal(type.price,1,'POINT',2,'COMMA')} + ' RSD'"
            ></strong>
          </div>
          <div class="info-box">
            <strong>Demo plaćanje</strong>
            <p>
              Ovo je studentska aplikacija. Potvrda kupovine simulira uspešno
              plaćanje. Novac se ne naplaćuje i podaci kartice nisu potrebni.
            </p>
          </div>
          <button class="button dark full">
            Potvrdi kupovinu <span>↗</span>
          </button>
        </form>
        <div class="alert error" th:unless="${onSale and remaining > 0}">
          Ulaznice trenutno nisu dostupne za kupovinu.
        </div>
      </section>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
  </body>
</html>
